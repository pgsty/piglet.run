#=======================================#
# Basics
#=======================================#
baseURL: https://piglet.run/
title: Piglet
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
enableRobotsTXT: true
enableGitInfo: false
hasCJKLanguage: true
capitalizeListTitles: false

pagination:
  pagerSize: 20

services:
  googleAnalytics:
    ID: G-W57GPGG6XX

#=======================================#
# Oink 0.6
#=======================================#
module:
  proxy: direct
  hugoVersion:
    extended: true
    min: "0.160.1"
  imports:
    - path: github.com/pgsty/oink

#=======================================#
# Languages and navigation
#=======================================#
languages:
  en:
    label: English
    locale: en-US
    weight: 1
    title: Piglet
    params:
      description: Piglet is the agentic Postgres runtime for turning one Linux machine into an AI-ready, production-capable workspace.
      time_format_blog: 'January 02, 2006'
      time_format_default: 'January 02, 2006'
    menus:
      main:
        - identifier: studio
          name: Config Studio
          url: /#studio
          weight: 10
          params:
            icon: fa-solid fa-sliders
        - identifier: docs
          name: Docs
          pageRef: /docs
          weight: 20
          params:
            icon: fa-solid fa-book-open
        - identifier: pigsty
          name: Pigsty
          url: https://pigsty.io/
          weight: 30
          params:
            icon: fa-solid fa-database

  zh:
    label: 简体中文
    locale: zh-CN
    weight: 2
    title: Piglet
    params:
      description: Piglet 是以 PostgreSQL 为核心的 Agentic 运行时，把一台 Linux 主机变成 AI 就绪、可上线的完整工作空间。
      time_format_blog: '2006年01月02日'
      time_format_default: '2006年01月02日'
    menus:
      main:
        - identifier: studio
          name: 配置工作台
          url: /zh/#studio
          weight: 10
          params:
            icon: fa-solid fa-sliders
        - identifier: docs
          name: 文档
          pageRef: /docs
          weight: 20
          params:
            icon: fa-solid fa-book-open
        - identifier: pigsty
          name: Pigsty
          url: https://pigsty.cc/
          weight: 30
          params:
            icon: fa-solid fa-database

#=======================================#
# Taxonomies, markup, and outputs
#=======================================#
taxonomies:
  categories: categories
  tags: tags

markup:
  goldmark:
    parser:
      wrapStandAloneImageWithinParagraph: false
      attribute:
        block: true
      autoHeadingID: true
      autoHeadingIDType: github
    renderer:
      unsafe: true
    extensions:
      footnote: true
      linkify: true
      table: true
      taskList: true
      typographer: true
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]
  highlight:
    style: tango
    codeFences: true
    noClasses: false
  tableOfContents:
    startLevel: 2
    endLevel: 4

outputs:
  home: [HTML, RSS, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

#=======================================#
# Site parameters
#=======================================#
params:
  description: "Piglet is the agentic Postgres runtime: AI coding tools, production PostgreSQL, shared storage, observability, and web delivery on one Linux machine."
  logo: icons/logo.svg
  images:
    - img/logo/piglet.png

  copyright:
    authors: Pigsty & Piglet Contributors
    from_year: 2025
    url: https://pgsty.com/

  github_repo: https://github.com/pgsty/piglet.run
  github_project_repo: https://github.com/pgsty/pigsty
  github_branch: main
  archived_version: false
  url_latest_version: https://piglet.run/

  comments:
    enable: true
    type: giscus

    # https://giscus.app/ - GitHub Discussions on pgsty/piglet.run
    giscus:
      repo: "pgsty/piglet.run"
      repoId: "R_kgDORAZzTw"
      category: "Announcements"
      categoryId: "DIC_kwDORAZzT84DD3xs"
      mapping: pathname
      strict: 0
      reactionsEnabled: 1
      emitMetadata: 0
      inputPosition: bottom

  offline_search: true
  offline_search_index: summary
  offline_search_summary_length: 100
  offline_search_max_results: 12

  ui:
    quick_links: [docs]
    breadcrumb: true
    section_index: cards
    sidebar_menu_compact: true
    sidebar_menu_foldable: true
    sidebar_menu_truncate: 1000
    sidebar_cache_limit: 1000
    sidebar_root_enabled: true
    sidebar_root_menu: false
    sidebar_icon_policy: all
    sidebar_expand_levels: 2
    sidebar_width_min: 220
    sidebar_width_max: 440
    sidebar_item_overflow: ellipsis
    dark_mode:
      show_menu: true
    page_context_menu:
      assistant_links: true
    image_zoom: true
    feedback: false
    reading_time: false
    scroll_spy: false
    translation_notice: false
